name: release-candidate

on:
  workflow_dispatch:

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-release-candidate:
    # A release candidate must be deliberately dispatched from main. This workflow
    # verifies and archives a candidate; REL-004 owns any authorized publication.
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      REPORT_DIR: /tmp/open-websearch-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0

      - name: Verify release version and exact pins
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          bun -e '
            const manifest = await Bun.file("package.json").json();
            const exact = /^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/;
            if (!exact.test(manifest.version)) throw new Error(`package version is not SemVer: ${manifest.version}`);
            if (manifest.packageManager !== `bun@${Bun.version}` || manifest.engines?.bun !== Bun.version) {
              throw new Error(`Expected package Bun ${manifest.packageManager}, running ${Bun.version}`);
            }
            for (const section of ["dependencies", "devDependencies", "optionalDependencies", "peerDependencies"]) {
              for (const [name, version] of Object.entries(manifest[section] ?? {})) {
                if (typeof version !== "string" || !exact.test(version)) {
                  throw new Error(`${section}.${name} is not exactly pinned: ${String(version)}`);
                }
              }
            }
            console.log(JSON.stringify({ version: manifest.version, bun: Bun.version, packageManager: manifest.packageManager }));
          ' | tee "$REPORT_DIR/exact-versions.json"

      - name: Install from the lockfile
        run: bun install --frozen-lockfile --ignore-scripts 2>&1 | tee "$REPORT_DIR/frozen-install.log"

      - name: Run the full deterministic gate
        run: |
          set -euo pipefail
          {
            bun run format:check
            bun run lint
            bun run lint:limits
            bun run lint:types
            bun run typecheck
            bun test --parallel --isolate
            bun run check
          } 2>&1 | tee "$REPORT_DIR/full-gate.log"

      - name: Grade the deterministic benchmark
        run: bun run benchmark:grade 2>&1 | tee "$REPORT_DIR/benchmark.log"

      - name: Build and inspect the npm tarball
        run: |
          set -euo pipefail
          bun pm pack --ignore-scripts 2>&1 | tee "$REPORT_DIR/pack.log"
          tarball=$(find . -maxdepth 1 -name '*.tgz' -type f -print -quit)
          test -n "$tarball"
          tar -tzf "$tarball" | tee "$REPORT_DIR/tarball-inventory.log"
          shasum -a 256 "$tarball" | tee "$REPORT_DIR/tarball-sha256.txt"
          cp "$tarball" "$REPORT_DIR/"

      - name: Smoke-test the packed artifact through Bunx
        run: bun test --parallel --isolate tests/package/packed-artifact.test.ts 2>&1 | tee "$REPORT_DIR/packed-artifact-smoke.log"

      - name: Generate candidate changelog
        run: |
          set -euo pipefail
          version=$(bun -e 'console.log((await Bun.file("package.json").json()).version)')
          {
            printf '# Release candidate %s\n\n' "$version"
            printf 'Commit: `%s`\n\n' "$GITHUB_SHA"
            printf '## Changes\n\n'
            git log --format='- %s (%h)' -1 "$GITHUB_SHA"
          } | tee "$REPORT_DIR/CHANGELOG.md"

      - name: Upload release-candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: error
          retention-days: 30
