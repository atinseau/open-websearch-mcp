name: orchestration-audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  orchestration-validation:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Run orchestration validation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if git cat-file -e "$BASE_SHA:scripts/orchestration/main.ts"; then
            if test -f "$GITHUB_WORKSPACE/scripts/orchestration/audit.ts"; then
              bun "$GITHUB_WORKSPACE/scripts/orchestration/audit.ts" \
                --repo "$GITHUB_WORKSPACE" --base "$BASE_SHA" --head "$HEAD_SHA"
            else
              bun "$GITHUB_WORKSPACE/scripts/orchestration/validate.ts" \
                --repo "$GITHUB_WORKSPACE"
            fi
          elif test -f "$GITHUB_WORKSPACE/scripts/orchestration/main.ts"; then
            bun "$GITHUB_WORKSPACE/scripts/bootstrap-validator.ts" \
              --repo "$GITHUB_WORKSPACE" --base "$BASE_SHA" --head "$HEAD_SHA"
          else
            bun build "$GITHUB_WORKSPACE/scripts/bootstrap-validator.ts" \
              --target bun --outfile /dev/null
            git diff --check "$BASE_SHA..$HEAD_SHA"
          fi
