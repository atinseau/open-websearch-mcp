name: orchestration-audit

on:
  pull_request:
    branches: [main]

concurrency:
  group: orchestration-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  orchestration-validation:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      REPORT_DIR: /tmp/open-websearch-reports
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0

      - name: Verify exact runtime and dependency pins
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          # shellcheck disable=SC2016
          bun -e '
            const manifest = await Bun.file("package.json").json();
            const exact = /^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/;
            if (manifest.packageManager !== `bun@${Bun.version}` || manifest.engines?.bun !== Bun.version) {
              throw new Error(`Expected package Bun ${manifest.packageManager}, running ${Bun.version}`);
            }
            for (const section of ["dependencies", "devDependencies", "optionalDependencies", "peerDependencies"]) {
              for (const [name, version] of Object.entries(manifest[section] ?? {})) {
                if (typeof version !== "string" || !exact.test(version)) {
                  throw new Error(`${section}.${name} is not exactly pinned: ${String(version)}`);
                }
              }
            }
            console.log(JSON.stringify({ bun: Bun.version, packageManager: manifest.packageManager }));
          ' | tee "$REPORT_DIR/exact-versions.log"

      - name: Install frozen dependencies
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --ignore-scripts 2>&1 | tee "$REPORT_DIR/frozen-install.log"
          bun pm ls --all > "$REPORT_DIR/dependency-tree.log"

      # The one gate the project already has. An earlier version of this
      # workflow listed the directories to test by hand, and the list went
      # stale: it named three directories that never existed and missed eight
      # that were added since, so discovery, rendering, storage, ranking,
      # extraction and the benchmark suites were never run before a merge.
      # Running `bun run check` here means the check that guards main and the
      # check that guards a publication are the same command, and adding a
      # test directory needs no edit to this file.
      #
      # tests/live stays out on its own terms: those tests skip themselves
      # unless OPEN_WEBSEARCH_LIVE is set, because they navigate the real Web.
      - name: Run the full deterministic gate
        run: bun run check 2>&1 | tee "$REPORT_DIR/gate.log"

      - name: Inspect package dry run
        run: |
          set -euo pipefail
          bun pm pack --dry-run --ignore-scripts 2>&1 | tee "$REPORT_DIR/package-dry-run.log"

      - name: Verify no generated or leaked files
        run: |
          set -euo pipefail
          git status --porcelain --untracked-files=all | tee "$REPORT_DIR/git-status.log"
          test ! -s "$REPORT_DIR/git-status.log"

      - name: Upload review reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-validation-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: error
          retention-days: 14
